<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0b0c10">
  <title>Мой первый сайт</title>
  <style>
    :root {
      color-scheme: dark;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #0b0c10;
      color: #f4f2ed;
    }

    * {
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      overflow: hidden;
      background:
        radial-gradient(ellipse at 50% 42%, rgba(115, 87, 255, 0.15), transparent 42%),
        radial-gradient(ellipse at 82% 18%, rgba(70, 207, 188, 0.08), transparent 34%),
        #0b0c10;
    }

    main {
      width: min(100% - 3rem, 760px);
      padding: 5rem 2rem;
      text-align: center;
    }

    .eyebrow {
      display: inline-flex;
      align-items: center;
      gap: 0.6rem;
      margin: 0 0 1.7rem;
      color: #aaa8b8;
      font-size: 0.78rem;
      font-weight: 600;
      letter-spacing: 0.2em;
      text-transform: uppercase;
    }

    .eyebrow::before {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #69e0c5;
      box-shadow: 0 0 14px rgba(105, 224, 197, 0.8);
      content: "";
    }

    h1 {
      margin: 0;
      font-size: clamp(5rem, 18vw, 10.5rem);
      font-weight: 750;
      letter-spacing: -0.085em;
      line-height: 0.95;
    }

    h1 span {
      color: #a99aff;
    }

    .intro {
      margin: 1.8rem 0 2.2rem;
      color: #a5a4af;
      font-size: clamp(1rem, 2.5vw, 1.2rem);
      line-height: 1.7;
    }

    .button {
      display: inline-flex;
      align-items: center;
      gap: 0.8rem;
      padding: 0.95rem 1.45rem;
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 999px;
      background: #f4f2ed;
      box-shadow: 0 8px 28px rgba(169, 154, 255, 0.16);
      color: #111116;
      font: inherit;
      font-size: 0.95rem;
      font-weight: 650;
      text-decoration: none;
      transition: transform 180ms ease, box-shadow 180ms ease, background 180ms ease;
    }

    .button:hover {
      transform: translateY(-3px);
      background: #fff;
      box-shadow: 0 12px 36px rgba(169, 154, 255, 0.3);
    }

    .button:focus-visible {
      outline: 3px solid #a99aff;
      outline-offset: 5px;
    }

    .button span {
      font-size: 1.15rem;
      transition: transform 180ms ease;
    }

    .button:hover span {
      transform: translateX(3px);
    }

    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        scroll-behavior: auto !important;
        transition-duration: 0.01ms !important;
      }
    }
  </style>
</head>
<body>
  <main>
    <p class="eyebrow">Мой первый сайт</p>
    <h1>Hello<span>!</span></h1>
    <p class="intro">Привет! 👋<br>Это мой первый сайт — и это только начало.</p>
    <button class="button" type="button">
      Давайте начнём <span aria-hidden="true">↗</span>
    </button>
  </main>
</body>
</html>
